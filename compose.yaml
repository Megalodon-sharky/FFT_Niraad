name: niraad-portfolio

services:
  portfolio:
    image: niraad-portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - /DATA/AppData/niraad_portfolio:/usr/share/nginx/html:ro

x-casaos:
  architectures:
    - amd64
  main: portfolio
  author: Niraad Siddharth Bhuva
  developer: Niraad Siddharth Bhuva
  category: Web
  scheme: http
  port_map: "6767"
  index: /
  volumes:
    - container: /usr/share/nginx/html
      description:
        en_us: Portfolio and resume HTML. Edit these files and refresh, no rebuild needed.
  title:
    en_us: Portfolio
  tagline:
    en_us: Portfolio and resume
  description:
    en_us: Personal portfolio and resume, static HTML served by nginx. Edit the HTML in the mounted folder and refresh the page to see changes.
