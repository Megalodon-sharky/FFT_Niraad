<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration Form</title>
    <style>
        :root {
            color-scheme: light dark;
            --accent: #0d8ca8;
            --accent-2: #d9772b;
            --text: #10222b;
            --muted: #4a6873;
            --glass: rgba(255, 255, 255, 0.55);
            --stroke: rgba(255, 255, 255, 0.7);
            --field: rgba(255, 255, 255, 0.65);
            --ring: rgba(13, 140, 168, 0.35);
            --shadow: 0 20px 50px rgba(10, 60, 80, 0.18);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e8f4f8;
                --muted: #9fbcc6;
                --glass: rgba(18, 34, 42, 0.55);
                --stroke: rgba(255, 255, 255, 0.14);
                --field: rgba(255, 255, 255, 0.07);
                --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 16px;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: #e7eff3;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        @media (prefers-color-scheme: dark) {
            body { background: #0c1a22; }
        }

        .card {
            width: 100%;
            max-width: 720px;
            padding: 34px 34px 28px;
            border-radius: 24px;
            background: var(--glass);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }

        h1 {
            margin: 0 0 4px;
            font-size: 26px;
            letter-spacing: -0.3px;
            color: var(--accent);
        }

        .sub {
            margin: 0 0 22px;
            font-size: 13px;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
        }

        .full { grid-column: 1 / -1; }

        @media (max-width: 560px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: 24px 20px; }
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--muted);
        }

        input[type=text], input[type=email], input[type=tel], input[type=date],
        select, textarea, input[type=file] {
            width: 100%;
            padding: 11px 13px;
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--stroke);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s, transform 0.18s;
        }

        textarea { min-height: 84px; resize: vertical; }

        /* Popup list uses the system surface, so set option colors explicitly
           or the inherited light-on-light text renders as a blank list. */
        select option {
            background: #ffffff;
            color: #10222b;
        }

        @media (prefers-color-scheme: dark) {
            select option {
                background: #16262f;
                color: #e8f4f8;
            }
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--ring);
            transform: translateY(-1px);
        }

        input:not(:placeholder-shown):invalid { border-color: #e0574d; }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 0;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text);
            border-radius: 999px;
            background: var(--field);
            border: 1px solid var(--stroke);
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.12s;
        }

        .chip:hover { transform: translateY(-1px); border-color: var(--accent); }

        .chip input { accent-color: var(--accent); margin: 0; }

        .chip:has(input:checked) {
            background: rgba(13, 140, 168, 0.16);
            border-color: var(--accent);
        }

        .chip:has(input:focus-visible) { box-shadow: 0 0 0 4px var(--ring); }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 26px;
        }

        button {
            padding: 11px 24px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--stroke);
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.18s, filter 0.18s;
        }

        .btn-reset {
            background: var(--field);
            color: var(--text);
        }

        .btn-submit {
            background: var(--accent);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 20px rgba(13, 140, 168, 0.35);
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.05); }
        button:active { transform: translateY(0) scale(0.98); }
        button:focus-visible { box-shadow: 0 0 0 4px var(--ring); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            button:hover, .chip:hover, input:focus { transform: none; }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Student Registration Form</h1>
        <p class="sub">All fields marked required must be completed before submitting.</p>

        <form>
            <div class="grid">
                <div>
                    <label for="student_id">Student ID</label>
                    <input type="text" id="student_id" name="student_id" placeholder="e.g. STU2025001" required>
                </div>

                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" minlength="15" placeholder="e.g. John Michael Smith" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                </div>

                <div>
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div>
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="cs">Computer Science</option>
                        <option value="ee">Electrical Engineering</option>
                        <option value="me">Mechanical Engineering</option>
                    </select>
                </div>

                <div class="full">
                    <label>Gender</label>
                    <div class="options">
                        <label class="chip" for="male"><input type="radio" id="male" name="gender" value="male" required> Male</label>
                        <label class="chip" for="female"><input type="radio" id="female" name="gender" value="female" required> Female</label>
                    </div>
                </div>

                <div class="full">
                    <label>Courses</label>
                    <div class="options">
                        <label class="chip" for="course1"><input type="checkbox" id="course1" name="courses" value="course1"> Course 1</label>
                        <label class="chip" for="course2"><input type="checkbox" id="course2" name="courses" value="course2"> Course 2</label>
                        <label class="chip" for="course3"><input type="checkbox" id="course3" name="courses" value="course3"> Course 3</label>
                    </div>
                </div>

                <div>
                    <label for="section">Section</label>
                    <input type="text" id="section" name="section" placeholder="A" required>
                </div>

                <div>
                    <label for="college">College</label>
                    <input type="text" id="college" name="college" placeholder="e.g. City Institute of Technology" required>
                </div>

                <div class="full">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Street, city, state, PIN" required></textarea>
                </div>

                <div class="full">
                    <label for="resume">Resume (PDF or Word)</label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                </div>
            </div>

            <div class="actions">
                <button type="reset" class="btn-reset">Reset</button>
                <button type="submit" class="btn-submit">Register</button>
            </div>
        </form>
    </main>
</body>

</html>
