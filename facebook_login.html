<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facebook Login Page</title>
    <style>
        :root {
            --fb-blue: #0866ff;
            --accent: #1877f2;
            --ink: #1c1e21;
            --headline: #111112;
            --input-border: #d0d3d6;
            --muted: #737373;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--card);
            color: var(--ink);
            font-family: "Segoe UI Historic", "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* ---------- top-left brand mark ---------- */
        .logo {
            position: absolute;
            top: 20px;
            left: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--fb-blue);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-weight: 800;
            font-size: 40px;
            line-height: 1;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        .logo span { transform: translateY(3px); }

        /* ---------- main split ---------- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 16px;
        }

        .left {
            flex: 1 1 500px;
            max-width: 520px;
            padding-right: 12px;
        }

        /* collage approximation */
        .collage {
            position: relative;
            height: 250px;
            margin-bottom: 18px;
        }

        .tile {
            position: absolute;
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
        }

        .t1 { width: 120px; height: 180px; left: 130px; top: 10px; background: #5aa9dd; }
        .t2 { width: 92px;  height: 92px;  left: 70px;  top: 40px; background: #e8926b; }
        .t3 { width: 84px;  height: 110px; left: 96px;  top: 120px; background: #c46bab; }
        .t4 { width: 74px;  height: 74px;  left: 208px; top: 150px; background: #92dcb3; }

        .avatar {
            position: absolute;
            left: 168px;
            top: 168px;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            background: #f0bd93;
        }

        .emoji {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .e1 { left: 60px; top: 20px; }
        .e2 { left: 236px; top: 96px; background: #f3425f; }

        h1.headline {
            font-size: 52px;
            font-weight: 600;
            line-height: 1.06;
            letter-spacing: -1px;
            color: var(--headline);
            margin: 0;
        }

        h1.headline .love { color: var(--accent); }

        /* ---------- divider ---------- */
        .divider {
            flex: 0 0 1px;
            height: 380px;
            background: #dadde1;
        }

        /* ---------- login column ---------- */
        .right {
            flex: 0 0 396px;
            max-width: 396px;
        }

        .right h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 12px;
        }

        .right input {
            width: 100%;
            height: 56px;
            padding: 0 18px;
            margin-bottom: 14px;
            font-size: 15px;
            color: var(--ink);
            background: var(--card);
            border: 0.8px solid var(--input-border);
            border-radius: 16px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .right input::placeholder { color: #62676b; }

        .right input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-login {
            height: 56px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: var(--fb-blue);
            transition: background-color .15s;
        }

        .btn-login:hover { background: #0356d6; }

        .forgot {
            display: block;
            width: fit-content;
            margin: 18px auto 20px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot:hover { text-decoration: underline; }

        .btn-create {
            height: 52px;
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            background: var(--card);
            border: 1px solid var(--accent);
            transition: background-color .15s;
        }

        .btn-create:hover { background: #f5f9ff; }

        .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

        .meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 22px;
            font-size: 15px;
            font-weight: 600;
            color: #1c2b33;
        }

        .meta .inf {
            font-size: 20px;
            transform: scaleX(1.4);
            color: #1c2b33;
        }

        /* ---------- language footer ---------- */
        footer {
            padding: 22px 16px 30px;
        }

        .langs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 20px;
            list-style: none;
            margin: 0 auto;
            padding: 0;
            max-width: 700px;
        }

        .langs a {
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        .langs a:hover { text-decoration: underline; }

        /* ---------- responsive ---------- */
        @media (max-width: 900px) {
            main {
                flex-direction: column;
                gap: 24px;
                padding-top: 80px;
            }

            .left { text-align: center; flex-basis: auto; padding-right: 0; }
            .collage { max-width: 320px; margin-left: auto; margin-right: auto; }
            h1.headline { font-size: 34px; }
            .divider { display: none; }
            .right { flex-basis: auto; width: 100%; max-width: 396px; }
        }
    </style>
</head>

<body>
    <div class="logo"><span>f</span></div>

    <main>
        <section class="left">
            <div class="collage">
                <div class="tile t1"></div>
                <div class="tile t2"></div>
                <div class="tile t3"></div>
                <div class="tile t4"></div>
                <div class="avatar"></div>
                <div class="emoji e1">😂</div>
                <div class="emoji e2">❤️</div>
            </div>
            <h1 class="headline">Explore the things <span class="love">you love</span>.</h1>
        </section>

        <div class="divider"></div>

        <section class="right">
            <h2>Log in to Facebook</h2>
            <form>
                <label for="email" hidden>Email address or mobile number</label>
                <input type="text" id="email" name="email"
                       placeholder="Email address or mobile number" required>

                <label for="pass" hidden>Password</label>
                <input type="password" id="pass" name="pass"
                       placeholder="Password" minlength="6" required>

                <button type="submit" class="btn btn-login">Log in</button>
            </form>

            <a class="forgot" href="#">Forgotten password?</a>

            <button type="button" class="btn btn-create">Create new account</button>

            <div class="meta"><span class="inf">&#8734;</span> Meta</div>
        </section>
    </main>

    <footer>
        <ul class="langs">
            <li><a href="#">English (UK)</a></li>
            <li><a href="#">ಕನ್ನಡ</a></li>
            <li><a href="#">اردو</a></li>
            <li><a href="#">मराठी</a></li>
            <li><a href="#">తెలుగు</a></li>
            <li><a href="#">हिन्दी</a></li>
            <li><a href="#">தமிழ்</a></li>
            <li><a href="#">More languages…</a></li>
        </ul>
    </footer>
</body>

</html>
